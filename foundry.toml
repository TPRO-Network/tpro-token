[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./table" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = true

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base = "https://mainnet.base.org"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
mainnet = "https://ethereum-rpc.publicnode.com"
polygon = "https://polygon-bor-rpc.publicnode.com"
