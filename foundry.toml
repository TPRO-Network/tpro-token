[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./table" }]
# Test-mode pins. Foundry 1.8 (2026-08-27) made `isolate` and `dynamic_test_linking` the defaults;
# the suite was reviewed in the classic mode, so every Foundry >= 1.0 keeps running it that way.
# The suite also passes with both switched on (checked on 1.8.1 with FOUNDRY_ISOLATE=true FOUNDRY_DYNAMIC_TEST_LINKING=true).
isolate = false
dynamic_test_linking = false

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = true

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
base = "https://mainnet.base.org"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
mainnet = "https://ethereum-rpc.publicnode.com"
polygon = "https://polygon-bor-rpc.publicnode.com"
