# Public repository CI: the three suites anyone can run (README.md, "Run the checks").
name: ci
on:
  push:
    branches: [main]
    tags: ["v3-*"]
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge --version
      - run: forge build --sizes
      - run: forge test -vv
  snapshot-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -r scripts/snapshot/requirements.lock
      - run: .venv/bin/python scripts/snapshot/selftest.py
  claim-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node website/verify_deploy.mjs website --table ./table-sample/
